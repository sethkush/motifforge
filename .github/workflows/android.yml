name: Android

# Builds the audio spike APK (published as a GitHub pre-release you can
# install from your phone) and runs the headless on-device audio test on an
# Android emulator. Results land in the job summary and as an artifact.
on:
  push:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of playback per scenario
        default: '20'

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build release APK
        working-directory: apps/audio_spike
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: audio-spike-apk
          path: apps/audio_spike/build/app/outputs/flutter-apk/app-release.apk
      - name: Publish as pre-release "audio-spike-latest"
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/audio_spike/build/app/outputs/flutter-apk/app-release.apk motifforge-audio-spike.apk
          gh release delete audio-spike-latest --yes --cleanup-tag || true
          gh release create audio-spike-latest motifforge-audio-spike.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Audio spike (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Install the APK on an Android device (allow installs from unknown sources), press Start, then Copy results."

  emulator:
    name: Headless audio test (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run spike test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          # Audio stays enabled (no -no-audio) so the app opens a real AAudio stream.
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: apps/audio_spike
          script: ../../tool/headless/run_android.sh ${{ github.event.inputs.seconds || '20' }}
      - name: Summary
        if: always()
        run: cat build/headless/android/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-android
          path: build/headless/android
          if-no-files-found: ignore
